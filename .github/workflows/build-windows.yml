name: Build Windows installer

# The shipped artefact is a Windows binary, and this project is developed on macOS.
# Cross-building a Windows PyInstaller executable from macOS is not possible, so the
# build has to happen on a real Windows runner. That is a hard requirement, not a
# convenience — see spec §3.2.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Run the suite on both platforms. Most of the code is platform-independent, but the
    # install path and file locking behave differently on Windows, and those are exactly
    # the areas that cannot be exercised on the development machine.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --dev
      - run: uv run pytest -v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --dev
      - run: uv pip install pyinstaller

      - name: Build the executable
        # --onefile : one artefact to hand over, nothing to unpack
        # --name    : matches install.EXE_NAME, so the desktop shortcut's target is right
        #
        # Deliberately NOT --noconsole. This is launched by a person who is waiting for
        # it, so the console IS the feedback: progress, results, and any error stay on
        # screen where Jeff can read them out over the phone. It was windowed while a
        # 6am scheduled task existed; that task is gone, and with it the reason to hide.
        run: |
          uv run pyinstaller `
            --onefile `
            --name ajz-refresh `
            --collect-all openpyxl `
            --hidden-import ajz.fmp `
            ajz/__main__.py

      - name: Smoke-test the binary on real Windows
        # The check the macOS test suite structurally cannot make: that the frozen
        # binary actually starts. No API key here, so this exercises startup and the
        # status path, not fetching.
        #
        # A console-subsystem binary runs synchronously and sets $LASTEXITCODE properly,
        # which a --noconsole build did not — that mismatch previously failed this step
        # a full second before the binary had finished printing a correct report.
        run: |
          .\dist\ajz-refresh.exe --status
          if ($LASTEXITCODE -ne 0) { throw "binary exited $LASTEXITCODE" }

      - name: Install end-to-end on real Windows
        # The gap the macOS suite structurally cannot close. The unit tests prove we
        # build the right PowerShell command; only this proves Windows accepts it.
        #
        # Covers, for real: that PowerShell creates the .lnk, that the registry Desktop
        # lookup returns a usable folder, that the exe copies into %LOCALAPPDATA%, and
        # that config.json is found beside the exe (the --onefile _MEIPASS bug).
        #
        # A fake key is enough: FMP answers 401, which raises without retrying, so the
        # first refresh fails fast, install completes regardless (by design), and every
        # step up to the network boundary is exercised on a real machine.
        run: |
          '{ "fmp_api_key": "ci-not-a-real-key" }' | Set-Content -Path dist\config.json -Encoding ascii

          # NO --install flag. A double-click cannot pass one, so this is the gesture the
          # instructions actually describe. Testing `--install` here is what let the real
          # first install fail while this job stayed green: it ran a refresh, said "not set
          # up yet", and closed too fast to read.
          .\dist\ajz-refresh.exe
          if ($LASTEXITCODE -ne 0) { throw "double-clicking the setup file exited $LASTEXITCODE" }

          $status = .\dist\ajz-refresh.exe --status | Out-String
          Write-Host $status
          if ($status -notmatch 'exe_present\s+True')       { throw "the program was not copied into place" }
          if ($status -notmatch 'config_present\s+True')    { throw "config.json beside the exe was not picked up" }
          if ($status -notmatch 'shortcut_present\s+True')  { throw "no desktop shortcut was created" }

          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'AJZ Dashboard.lnk'
          if (-not (Test-Path $lnk)) { throw "shortcut missing at $lnk" }

          # Resolve the .lnk back through COM and confirm it points at the installed exe,
          # not at wherever setup happened to be run from (Downloads gets emptied).
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          Write-Host "shortcut target: $target"
          if ($target -notlike '*\AJZ\ajz-refresh.exe') { throw "shortcut points at $target" }

      - name: Upgrade over the existing install
        # Shipping a new version means running the new setup over the old one, so the
        # upgrade path is the install path run twice. Nothing is versioned - the exe is
        # overwritten in place and the shortcut has a fixed name - so this proves there
        # is no second copy, no duplicate icon, and nothing of his is deleted.
        run: |
          $appDir = Join-Path $env:LOCALAPPDATA 'AJZ'
          Set-Content -Path (Join-Path $appDir 'history.sqlite') -Value 'the whole series' -Encoding ascii
          New-Item -ItemType Directory -Force -Path (Join-Path $appDir 'backups') | Out-Null
          Set-Content -Path (Join-Path $appDir 'backups\2026-08-24.xlsx') -Value 'yesterday' -Encoding ascii

          .\dist\ajz-refresh.exe --install
          if ($LASTEXITCODE -ne 0) { throw "reinstall exited $LASTEXITCODE" }

          if ((Get-Content (Join-Path $appDir 'history.sqlite')) -ne 'the whole series') {
            throw "the history series was not preserved across an upgrade"
          }
          if ((Get-Content (Join-Path $appDir 'backups\2026-08-24.xlsx')) -ne 'yesterday') {
            throw "backups were not preserved across an upgrade"
          }

          $icons = @(Get-ChildItem ([Environment]::GetFolderPath('Desktop')) -Filter 'AJZ Dashboard*.lnk')
          Write-Host "desktop icons after upgrade: $($icons.Count)"
          if ($icons.Count -ne 1) { throw "expected exactly one shortcut, found $($icons.Count)" }

      - uses: actions/upload-artifact@v4
        with:
          name: ajz-refresh-windows
          path: dist/ajz-refresh.exe
          retention-days: 90
